# Builds lia on every push. Each build is a ready-to-use portable folder:
#   lia-<platform>/  the app, subjects/ with the example banks, README.txt
# Pushing a tag like v0.1.0 also attaches the three zips to a GitHub release.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Linux libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test
        working-directory: src-tauri

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # A plain exe without installer: the portable app.
      - run: npx tauri build --no-bundle
      - name: Portable folder
        shell: bash
        run: |
          mkdir -p out/lia-windows/subjects
          cp src-tauri/target/release/lia.exe out/lia-windows/
          cp subjects/example.json subjects/example-images.zip out/lia-windows/subjects/
          cp README.txt out/lia-windows/
      - uses: actions/upload-artifact@v4
        with:
          name: lia-windows
          path: out/lia-windows

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Universal app (Apple Silicon and Intel), ad-hoc signed (see tauri.conf.json).
      - run: npx tauri build --target universal-apple-darwin --bundles app
      - name: Portable folder
        run: |
          mkdir -p out/lia-macos/subjects
          cp -R src-tauri/target/universal-apple-darwin/release/bundle/macos/lia.app out/lia-macos/
          cp subjects/example.json subjects/example-images.zip out/lia-macos/subjects/
          cp README.txt out/lia-macos/
          # ditto keeps the app bundle intact (symlinks, permissions); artifact uploads would not.
          cd out && ditto -c -k --keepParent lia-macos lia-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lia-macos
          path: out/lia-macos.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Linux libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Built on the oldest supported Ubuntu, so the AppImage also runs on older systems.
      - run: npx tauri build --bundles appimage
      - name: Portable folder
        run: |
          mkdir -p out/lia-linux/subjects
          cp src-tauri/target/release/bundle/appimage/*.AppImage out/lia-linux/lia.AppImage
          chmod +x out/lia-linux/lia.AppImage
          cp subjects/example.json subjects/example-images.zip out/lia-linux/subjects/
          cp README.txt out/lia-linux/
          # zip keeps the executable bit; artifact uploads would drop it.
          cd out && zip -r lia-linux.zip lia-linux
      - uses: actions/upload-artifact@v4
        with:
          name: lia-linux
          path: out/lia-linux.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect zips
        run: |
          mkdir release
          (cd artifacts && zip -r ../release/lia-windows.zip lia-windows)
          cp artifacts/lia-macos/lia-macos.zip artifacts/lia-linux/lia-linux.zip release/
          ls -l release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip --repo "$GITHUB_REPOSITORY" --title "lia $GITHUB_REF_NAME" --generate-notes
