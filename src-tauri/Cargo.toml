[package]
name = "lia"
version = "0.1.0"
description = "lia, an offline exam trainer"
authors = ["Tim Schwietzke"]
repository = "https://github.com/TimSchwietzke/lia"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
